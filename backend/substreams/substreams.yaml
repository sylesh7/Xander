specVersion: v0.1.0

package:
  name: xander_substreams
  version: v0.1.0
  url: https://github.com/Suganthan96/Xander
  doc: |
    Real-time funding evidence for the Xander firewall.

    Emits decoded ERC-20 Transfer logs and native-value transfers, filtered to a
    watch list passed as a module parameter. Consumed by the Phase 10 Node sink,
    which normalizes both into EvidenceEvent rows.

    Scope is deliberately narrow: this decodes and filters. Clustering, feature
    extraction and scoring stay in the TypeScript engine, where a policy change
    does not mean recompiling WASM and resyncing.

# No entity/graph_out import: substreams-entity-change 2.0.0 (its latest
# release) pins `substreams ^0.6`, incompatible with the `substreams ^0.7` this
# module builds against, and links two copies of the crate into one WASM
# binary. Not needed anyway — the current substreams-sink guide consumes the
# typed FundingTransfers protobuf directly over gRPC (Phase 10), never through
# EntityChanges/a subgraph.

protobuf:
  files:
    - xander.proto
  importPaths:
    - ./proto

binaries:
  default:
    type: wasm/rust-v1
    file: ./target/wasm32-unknown-unknown/release/xander_substreams.wasm

# Base Sepolia, not mainnet: this is the hackathon build/demo target — cheap
# 2s blocks, no real funds at risk while iterating, and `base` is already a
# supported TOKEN_API_NETWORKS entry (Phase 3), so evidence from this chain
# slots into the same pipeline without a new network being invented anywhere.
# Switching to Base mainnet (or Ethereum) at ship time is a one-line change
# (network + initialBlock) since the address watch-list is already config,
# never hardcoded (Section 0.2 rule 1) — nothing else here is chain-specific.
#
# Endpoint verified live 2026-09-08: basesepolia.substreams.pinax.network:443
# resolves and streamed real decoded transfers. NOT documented in
# thegraph.com/streamingfast's published chains-and-endpoints table at the
# time of writing — found by pattern-matching Pinax's own (documented)
# basesepolia.rpc.pinax.network RPC endpoint naming and confirming reachability
# directly, then proving it with a real `substreams run`. If this endpoint
# ever stops resolving, that is the first thing to re-verify, not assume.
network: base-sepolia

modules:
  - name: map_funding_transfers
    kind: map
    # A recent, comfortably-finalized Base Sepolia block as of 2026-09-08 (head
    # was ~46,539,941). Pick a fresher one if this drifts far behind head.
    initialBlock: 46530000
    inputs:
      # Comma-separated lower-case addresses to watch. Config, not a hardcoded
      # list (Section 0.2 rule 1) — changing campaign is a parameter change.
      #
      # EMPTY MEANS EMIT EVERYTHING. That is fine for a short backfill and
      # ruinous at head: every ERC-20 transfer on Ethereum. Always pass a list
      # when tailing live.
      - params: string
      - source: sf.ethereum.type.v2.Block
    output:
      type: proto:xander.v1.FundingTransfers

params:
  map_funding_transfers: ''
