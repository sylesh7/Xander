# Phase 1.4 / Phase 2 — local infra for BOTH tracks.
# Suganthan owns this file; Sylesh runs the same stack.
services:
  postgres:
    image: postgres:16
    container_name: xander-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: xander
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d xander']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: xander-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  # V2 Phase 4. Reuses the Postgres above rather than standing up a second
  # database: auto-setup creates its own `temporal` and `temporal_visibility`
  # schemas there, so the whole stack stays two containers plus this one.
  #
  # Host port 7234, not Temporal's default 7233 — same reasoning as the 5433 and
  # 6380 remaps, so this coexists with any other Temporal a developer runs.
  temporal:
    image: temporalio/auto-setup:1.29.0
    container_name: xander-temporal
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: user
      POSTGRES_PWD: pass
      POSTGRES_SEEDS: postgres
      # Namespace the workflows live in, created automatically at first boot.
      DEFAULT_NAMESPACE: xander
      DEFAULT_NAMESPACE_RETENTION: 72h
    ports:
      - '7234:7233'
    healthcheck:
      test: ['CMD', 'tctl', '--address', 'temporal:7233', 'cluster', 'health']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  # The Temporal Web UI. Separate image — auto-setup does not bundle it.
  # Browse running and completed workflows, their full event history, and the
  # exact input/result payloads of every activity.
  temporal-ui:
    image: temporalio/ui:2.54.1
    container_name: xander-temporal-ui
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      # Talks to the server over the compose network, so this is the container
      # port 7233, not the 7234 the host sees.
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_UI_PORT: 8080
      TEMPORAL_DEFAULT_NAMESPACE: xander
      TEMPORAL_CORS_ORIGINS: http://localhost:8233
    ports:
      - '8233:8080'

volumes:
  postgres-data:
  redis-data:
