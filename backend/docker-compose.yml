# Phase 1.4 / Phase 2 — local infra for BOTH tracks.
# Suganthan owns this file; Sylesh runs the same stack.
services:
  postgres:
    image: postgres:16
    container_name: sybil-shield-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: sybil_shield
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d sybil_shield']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: sybil-shield-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
